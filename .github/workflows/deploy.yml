name: Deploy — Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      target:
        description: "배포 대상 (all | api | vendor-web | admin-web)"
        required: false
        default: "all"

# Railway + Vercel은 GitHub 연동 후 자동 배포됨
# 이 워크플로우는: 테스트 통과 확인 → 배포 상태 검증 게이트 역할

jobs:
  # ── 1. API 테스트 (배포 전 필수 통과) ──────────────────────────
  api-test:
    name: API Tests (gate)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'api' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'all' ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key-minimum-32-characters-long"
          ALLOWED_ORIGINS: "http://localhost:3000"
        run: pytest --tb=short -q

  # ── 2. vendor-web 빌드 검증 ─────────────────────────────────────
  vendor-web-build:
    name: vendor-web build (gate)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'vendor-web' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'all' ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build vendor-web
        working-directory: apps/vendor-web
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.railway.app"
        run: npm run build

  # ── 3. admin-web 빌드 검증 ──────────────────────────────────────
  admin-web-build:
    name: admin-web build (gate)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'admin-web' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'all' ||
      github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Build admin-web
        working-directory: apps/admin-web
        env:
          NEXT_PUBLIC_API_URL: "https://placeholder.railway.app"
        run: npm run build

  # ── 4. 배포 완료 요약 ───────────────────────────────────────────
  deploy-summary:
    name: Deploy Summary
    runs-on: ubuntu-latest
    needs: [api-test, vendor-web-build, admin-web-build]
    if: always()

    steps:
      - name: 배포 게이트 결과 출력
        run: |
          echo "========================================="
          echo "  JH BuildFlow — 배포 게이트 결과"
          echo "========================================="
          echo "API Tests       : ${{ needs.api-test.result }}"
          echo "vendor-web build: ${{ needs.vendor-web-build.result }}"
          echo "admin-web build : ${{ needs.admin-web-build.result }}"
          echo ""
          echo "Railway / Vercel 자동 배포는 각 서비스 대시보드에서 확인하세요."
          echo "  Railway API  : https://railway.app/dashboard"
          echo "  Vercel Apps  : https://vercel.com/dashboard"
          echo "========================================="

      - name: Fail if any gate failed
        if: >
          needs.api-test.result == 'failure' ||
          needs.vendor-web-build.result == 'failure' ||
          needs.admin-web-build.result == 'failure'
        run: |
          echo "배포 게이트 실패 — Railway/Vercel 자동 배포를 확인하세요."
          exit 1

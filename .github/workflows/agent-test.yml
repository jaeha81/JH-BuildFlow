name: Agent Engine Tests

on:
  push:
    paths:
      - "apps/admin-desktop/src/agent-engine/**"
      - "apps/admin-desktop/vitest.config.ts"
      - ".github/workflows/agent-test.yml"
  pull_request:
    paths:
      - "apps/admin-desktop/src/agent-engine/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin-desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/admin-desktop
        run: npm ci

      - name: Run vitest
        working-directory: apps/admin-desktop
        run: npm test

      - name: TypeScript type check
        working-directory: apps/admin-desktop
        run: npm run typecheck
